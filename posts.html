<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing &amp; Essays — Arpit Jain</title>
    <meta name="description" content="Essays, analysis, and craft notes on product strategy, dynamic pricing, and 0-to-1 execution by Arpit Jain.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #08090c;
            --bg-card: #101217;
            --bg-card-hover: #16181f;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.18);

            --text-white: #ffffff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;

            --accent-green: #22c55e;
            --accent-yellow: #edff4f;
            --accent-blue: #2563eb;
            --accent-mint: #3ddc97;

            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.6;
        }

        body {
            background-color: var(--bg-base);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 3rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: 0 1.25rem;
            box-sizing: border-box;
        }

        @media (max-width: 400px) {
            .container {
                padding: 0 1rem;
            }
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 9, 12, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1.1rem 0;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-white);
            text-decoration: none;
            letter-spacing: -0.02em;
        }

        .status-line {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.84rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            flex-shrink: 0;
        }

        .back-nav {
            padding-top: 2rem;
            margin-bottom: 1.5rem;
        }

        .back-link {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            color: var(--text-muted);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-white);
            transform: translateX(-3px);
        }

        .page-title-row {
            margin-bottom: 1.75rem;
        }

        .section-label {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            margin-bottom: 0.35rem;
            display: block;
        }

        .page-title {
            font-size: clamp(1.8rem, 5.5vw, 2.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-white);
        }

        /* Filter Controls */
        .filter-bar {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .search-box {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 0.65rem 1rem;
            font-family: var(--font-sans);
            font-size: 0.88rem;
            color: var(--text-white);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-box:focus {
            border-color: var(--border-hover);
        }

        .search-box::placeholder {
            color: var(--text-dim);
        }

        .tags-bar {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .filter-pill {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .filter-pill:hover {
            color: var(--text-white);
            border-color: var(--border-hover);
        }

        .filter-pill.is-active {
            background: #ffffff;
            color: #08090c;
            border-color: #ffffff;
            font-weight: 600;
        }

        /* Post Cards */
        .posts-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.25rem 1.35rem;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: all 0.2s ease;
        }

        .post-card:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .post-card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.75rem;
            margin-bottom: 0.4rem;
        }

        .post-card-title {
            font-size: 1.12rem;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.01em;
            line-height: 1.35;
        }

        .post-card-date {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .post-card-desc {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 0.85rem;
        }

        .post-card-tags {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
        }

        .post-tag {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            color: var(--text-dim);
            padding: 2px 7px;
            border-radius: 6px;
        }

        .empty-state {
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 0.85rem;
            padding: 2rem 0;
            text-align: center;
        }

        .footer {
            margin-top: 3.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            width: 100%;
        }

        .social-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
        }

        .social-pill {
            font-family: var(--font-mono);
            font-size: 0.76rem;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: 9999px;
            text-decoration: none;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .social-pill:hover {
            color: var(--text-white);
            border-color: var(--border-hover);
        }

        .footer-note {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="brand-name">arpit.jain</a>
            <div class="status-line">
                <span class="status-dot"></span>
                <span>shipping @ PriceLabs</span>
            </div>
        </div>
    </header>

    <main class="container">

        <nav class="back-nav">
            <a href="index.html#writing" class="back-link">← Back to Portfolio</a>
        </nav>

        <div class="page-title-row">
            <span class="section-label">Archive</span>
            <h1 class="page-title">Writing &amp; Notes</h1>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" class="search-box" placeholder="Search essays and notes..." autocomplete="off">
            <div class="tags-bar" id="tagFilters"></div>
        </div>

        <div class="posts-grid" id="postsList"></div>

        <footer class="footer">
            <div class="social-links">
                <a href="https://www.linkedin.com/in/jainarpit26/" target="_blank" rel="noopener noreferrer" class="social-pill">LinkedIn</a>
                <a href="https://x.com/arpit2602" target="_blank" rel="noopener noreferrer" class="social-pill">X</a>
                <a href="mailto:arpit2602@gmail.com" class="social-pill">Email</a>
                <a href="posts.html" class="social-pill">Blog</a>
            </div>
            <p class="footer-note">© 2026 Arpit Jain · arpit.jain</p>
        </footer>

    </main>

    <script>
        let allPosts = [];
        let selectedTag = null;
        let searchQuery = '';

        async function loadPosts() {
            try {
                const res = await fetch('posts.json');
                allPosts = await res.json();
                renderTags();
                renderPosts();
            } catch (e) {
                console.error(e);
            }
        }

        function renderTags() {
            const tagSet = new Set();
            allPosts.forEach(post => (post.tags || []).forEach(t => tagSet.add(t)));
            const container = document.getElementById('tagFilters');
            
            let html = `<span class="filter-pill ${selectedTag === null ? 'is-active' : ''}" onclick="selectTag(null)">All</span>`;
            tagSet.forEach(tag => {
                const active = selectedTag === tag ? 'is-active' : '';
                html += `<span class="filter-pill ${active}" onclick="selectTag('${tag}')">${tag}</span>`;
            });
            container.innerHTML = html;
        }

        function selectTag(tag) {
            selectedTag = tag;
            renderTags();
            renderPosts();
        }

        function renderPosts() {
            const list = document.getElementById('postsList');
            let filtered = allPosts;

            if (selectedTag) {
                filtered = filtered.filter(p => (p.tags || []).includes(selectedTag));
            }

            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(p =>
                    (p.title && p.title.toLowerCase().includes(q)) ||
                    (p.preview && p.preview.toLowerCase().includes(q)) ||
                    ((p.tags || []).some(t => t.toLowerCase().includes(q)))
                );
            }

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">No matching essays found.</div>';
                return;
            }

            list.innerHTML = filtered.map(post => `
                <a href="${post.file}" class="post-card">
                    <div class="post-card-header">
                        <h2 class="post-card-title">${post.title}</h2>
                        <span class="post-card-date">${post.date || ''}</span>
                    </div>
                    <p class="post-card-desc">${post.preview || ''}</p>
                    <div class="post-card-tags">
                        ${(post.tags || []).map(t => `<span class="post-tag">${t}</span>`).join('')}
                    </div>
                </a>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderPosts();
        });

        loadPosts();
    </script>

</body>
</html>
